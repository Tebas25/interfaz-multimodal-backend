name: Backend CI (Integración Continua)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.14.0"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black pytest pytest-cov httpx
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Análisis de Código y Estilo (CheckStyle + PMD)
      run: |
        black --check app/
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Pruebas Unitarias y Cobertura (JUnit + JaCoCo)
      run: |
        pytest app/ --cov=app --cov-report=term-missing --cov-fail-under=80